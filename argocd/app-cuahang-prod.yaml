apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cuahang-prod
  namespace: argocd
spec:
  project: cuahang-project
  source:
    repoURL: https://github.com/doduong27/cuahang-gitops.git
    targetRevision: HEAD
    path: projects/cuahang/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: cuahang-prod
  # Môi trường Prod KHÔNG tự động deploy (Yêu cầu phê duyệt và bấm Sync thủ công)
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
