apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cuahang-dev
  namespace: argocd
spec:
  project: cuahang-project
  source:
    repoURL: https://github.com/doduong27/cuahang-gitops.git
    targetRevision: HEAD
    path: projects/cuahang/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: cuahang-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
