apiVersion: apps/v1
kind: Deployment
metadata:
  name: cuahang-be
  labels:
    app: cuahang-be
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cuahang-be
  template:
    metadata:
      labels:
        app: cuahang-be
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: backend
          image: cuahang-be:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - secretRef:
                name: cuahang-db-secret
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
