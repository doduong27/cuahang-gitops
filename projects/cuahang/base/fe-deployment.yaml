apiVersion: apps/v1
kind: Deployment
metadata:
  name: cuahang-fe
  labels:
    app: cuahang-fe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cuahang-fe
  template:
    metadata:
      labels:
        app: cuahang-fe
    spec:
      containers:
        - name: frontend
          image: cuahang-fe:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "30m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
